<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de reparación de sondas – Área Mecánica de Servicios</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebed;--panel:#f6f7f8;--ink:#1d2830;--mute:#5f6c75;--line:#c9d0d5;--accent:#e8a200;--accent-ink:#1d2830;--ok:#2f7d4f;--bad:#b83a2e;--info:#2f6f9f;
--c0:#c9d0d5;--c1:#2f6f9f;--c2:#e8a200;--c3:#c2377a;--c4:#7a4fa0;--c5:#d2561f;--c6:#1f8f8f;--c7:#2f7d4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b21;--panel:#1d272f;--ink:#e6eaed;--mute:#8d9aa4;--line:#33414b;--accent:#f0b429;--accent-ink:#141b21;--ok:#4fb67a;--bad:#e5695c;--info:#5aa5d8;--c0:#3a4853;--c1:#5aa5d8;--c2:#f0b429;--c3:#e868a5;--c4:#a583c9;--c5:#ee7a4a;--c6:#4cc3c3;--c7:#4fb67a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b21;--panel:#1d272f;--ink:#e6eaed;--mute:#8d9aa4;--line:#33414b;--accent:#f0b429;--accent-ink:#141b21;--ok:#4fb67a;--bad:#e5695c;--info:#5aa5d8;--c0:#3a4853;--c1:#5aa5d8;--c2:#f0b429;--c3:#e868a5;--c4:#a583c9;--c5:#ee7a4a;--c6:#4cc3c3;--c7:#4fb67a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.01em;margin:0}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;padding:10px 16px 8px;border-bottom:3px solid var(--accent)}
h1{font-size:26px;font-weight:700;line-height:1}
header p{margin:2px 0 0;font-size:13px;color:var(--mute)}
main{max-width:1440px;margin:0 auto;padding:10px 12px 28px}
.vt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px;font-size:13px;color:var(--mute)}
.vt button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);padding:5px 8px;cursor:default}
.kpi .num{font-size:24px;font-weight:700;line-height:1}.kpi span{color:var(--mute);font-size:11.5px;line-height:1.15;display:block;margin-top:1px}
.kpi.bad{border-left-color:var(--bad)}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.kpi[aria-pressed=true]{outline:3px solid var(--accent)}
.grid{display:grid;grid-template-columns:280px 1fr;gap:10px;margin-top:10px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);padding:9px 11px;min-width:0}
h2{font-size:20px;font-weight:600;margin-bottom:6px}
h3{font-size:17px;font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,button.btn{font:inherit;padding:5px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px}
button.btn{cursor:pointer;font-weight:600}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.sm{padding:2px 7px;font-size:12px}
:focus-visible{outline:3px solid var(--info);outline-offset:1px}
.mc{width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--line);padding:6px 9px;margin-bottom:6px;cursor:pointer;display:block}
.mc[aria-pressed=true]{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.mc .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mc .num{font-size:22px;font-weight:700}
.mc small,.sub{color:var(--mute);font-size:12.5px}
.seg{display:flex;height:8px;background:var(--c0);margin:4px 0 3px}
.seg i{display:block;height:100%}
.late{color:var(--bad);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute);margin:4px 0 6px}
.legend b{display:inline-block;width:10px;height:10px;margin-right:5px}
.comp{border-top:1px solid var(--line);padding:6px 0}
[hidden]{display:none!important}
.pct{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1;padding:0 2px;color:#000;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pct{color:var(--ink)}}
:root[data-theme="dark"] .pct{color:var(--ink)}
.pct.u{font-size:28px}.pct.k{font-size:22px}
.hd .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
button.tg{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;letter-spacing:inherit}
button.tg::before{content:"▾";display:inline-block;width:1.1em;color:var(--mute)}
button.tg[aria-expanded=false]::before{content:"▸"}
input[type=color]{padding:2px;height:36px;width:100%}
.unit{border:1px solid var(--line);border-left:6px solid var(--accent);background:var(--bg);padding:6px 10px;margin-top:8px}
.unit>.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.unit>.hd h2{margin:0;font-size:22px}
.comp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:720px}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
th{color:var(--mute);font-weight:600;font-size:12px}
td select{border-left-width:6px;font-weight:600;padding:2px 4px;font-size:13px}
td,th{overflow-wrap:anywhere}
td:nth-child(3),th:nth-child(3){text-align:center}
td select{width:100%;min-width:0}
button.btn{white-space:nowrap}
.empty{padding:14px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:18px;max-width:540px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
form .full{grid-column:1/-1}
form .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between}
</style>
</head>
<body>
<header>
  <div><h1>Control de reparación de sondas – Área Mecánica de Servicios</h1><p>Avance por sonda, componente y pieza según su etapa</p></div>
  <div class="tools"><button class="btn" id="ns">Nueva sonda</button><button class="btn primary" id="np">Nueva pieza</button></div>
</header>
<main>
  <div class="vt" id="vt"></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <section><h2>Sondas en taller</h2><div id="ms"></div></section>
    <section id="det"></section>
  </div>
</main>

<dialog id="dp"><form id="fp" method="dialog">
  <label>Sonda<select name="sonda" required></select></label>
  <label>Unidad<select name="unidad"></select><input name="unidadN" placeholder="Nombre de la nueva unidad (Ej. Unidad de potencia)" hidden></label>
  <label>Kit / componente<select name="comp"></select><input name="compN" placeholder="Nombre del nuevo kit (Ej. Kit motor diesel)" hidden></label>
  <label>Pieza<input name="pieza" required placeholder="Ej. Soporte"></label>
  <label>Código<input name="cod" placeholder="Ej. 4521-A"></label>
  <label>Cantidad<input name="cant" type="number" min="1" value="1"></label>
  <label>Etapa<select name="etapa"></select></label>
    <label>N.º de RQ<input name="oc"></label>
  <label>N.º de SMM3<input name="smm"></label>
  <label>Fecha prometida<input name="fecha" type="date"></label>
  <div class="acts"><button type="button" class="btn" id="dd">Eliminar</button><span><button type="button" class="btn" id="cp">Cancelar</button> <button class="btn primary" type="submit">Guardar pieza</button></span></div>
</form></dialog>

<dialog id="dm"><form id="fm" method="dialog">
  <label class="full">Sonda<input name="n" required placeholder="Ej. LF-90 #14"></label>
  <label>Fecha de ingreso<input name="ing" type="date" required></label>
  <label>Fecha programada<input name="com" type="date" required></label>
  <div class="acts"><button type="button" class="btn" id="dmx">Eliminar sonda</button><span><button type="button" class="btn" id="cm">Cancelar</button> <button class="btn primary" type="submit">Guardar sonda</button></span></div>
</form></dialog>

<dialog id="du"><form id="fu" method="dialog">
  <label class="full">Nombre de la unidad<input name="n" required></label>
  <label>Color<input name="c" type="color" value="#e8a200"></label>
  <label>&nbsp;<button type="button" class="btn" id="uc0">Color por defecto</button></label>
  <div class="acts"><span></span><span><button type="button" class="btn" id="cu">Cancelar</button> <button class="btn primary" type="submit">Guardar unidad</button></span></div>
</form></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<div id="sync" style="position:fixed;right:10px;bottom:8px;font:600 12px system-ui,sans-serif;background:rgba(255,255,255,.9);padding:3px 8px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:50"></div>
<script>
const ST=["Pendiente","Compras","Maestranza","Soldadura","Pintura","Servicio externo","Montaje","Listo"];
const W=[0,0,0,0,.7,0,.85,1];
const KEY="sondas-v2";
const $=id=>document.getElementById(id);
const d0=new Date();d0.setHours(0,0,0,0);
const iso=n=>{const d=new Date(d0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const today=iso(0);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fmt=s=>{if(!s)return"—";const[y,m,d]=s.split("-");return d+"/"+m};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let n=0;const P=(s,c,p,cant,e,prov,oc,f)=>({id:"p"+(++n),s,c,p,cant,e,prov,oc,f});
const seed=()=>({
 m:[{id:"m1",n:"LF-90 #14",ing:iso(-9),com:iso(6)},{id:"m2",n:"LF-70 #07",ing:iso(-14),com:iso(-2)},{id:"m3",n:"LM-75 #03",ing:iso(-2),com:iso(10)}],
 p:[
  P("m1","Cabezal de rotación","Eje principal",1,"Maestranza","Maestranza interna","",iso(2)),
  P("m1","Cabezal de rotación","Rodamientos",2,"Compras","SKF","OC-5521",iso(4)),
  P("m1","Cabezal de rotación","Sellos y retenes",1,"Listo","Almacén","",""),
  P("m1","Cabezal de rotación","Carcasa con fisura",1,"Soldadura","Soldadura taller","",iso(1)),
  P("m1","Bomba de lodo","Pistones",3,"Compras","Proveedor local","OC-5530",iso(5)),
  P("m1","Bomba de lodo","Camisas",3,"Maestranza","Maestranza interna","",iso(3)),
  P("m2","Winche","Tambor",1,"Soldadura","Soldadura taller","",iso(-1)),
  P("m2","Winche","Banda de freno",1,"Montaje","Mecánico","",iso(1)),
  P("m2","Winche","Cable de acero",1,"Compras","Proveedor local","OC-5498",iso(-3)),
  P("m2","Chasis","Soporte de mástil",1,"Soldadura","Soldadura taller","",iso(0)),
  P("m2","Chasis","Pintura de chasis",1,"Pintura","Pintura taller","",iso(2)),
  P("m3","Sistema hidráulico","Cilindro de levante",1,"Pendiente","","",""),
  P("m3","Sistema hidráulico","Mangueras",6,"Compras","Proveedor local","OC-5541",iso(7)),
  P("m3","Sistema hidráulico","Bomba de pistones",1,"Maestranza","Maestranza interna","",iso(8))
 ]});
let D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!D.m||!D.p)D=seed();
D.uc=D.uc||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}push()};
let COL=new Set();try{COL=new Set(JSON.parse(localStorage.getItem("sondas-col")||"[]"))}catch(e){}
const saveCol=()=>{try{localStorage.setItem("sondas-col",JSON.stringify([...COL]))}catch(e){}};
let vista="sonda";try{vista=localStorage.getItem("sondas-vista")==="general"?"general":"sonda"}catch(e){}
let sel=D.m[0]?.id,fe="",editP=null,editM=null;
const LATE="__late__";
const fm=p=>!fe||(fe===LATE?late(p):p.e===fe);
const fl=()=>fe===LATE?"Atrasadas":fe;
const idx=e=>ST.indexOf(e);
const prog=ps=>ps.length?Math.round(ps.reduce((s,p)=>s+W[idx(p.e)],0)/ps.length*100):0;
const late=p=>p.e!=="Listo"&&p.f&&p.f<today;
const seg=ps=>`<div class="seg" title="Distribución de piezas por etapa">`+ST.map((e,i)=>{const c=ps.filter(p=>p.e===e).length;return c?`<i style="width:${c/ps.length*100}%;background:var(--c${i})"></i>`:""}).join("")+`</div>`;
const ukey=(s,u)=>s+"|"+u,NEW="__new__",NONE="__none__",tok=u=>u===""?NONE:u,untok=v=>v===NONE?"":v;
$("fp").elements.etapa.innerHTML=ST.map(e=>`<option>${e}</option>`).join("");
function render(){
 const all=D.p;
 const kp=vista==="general"?all:all.filter(p=>p.s===sel),ms=D.m.find(x=>x.id===sel);
 $("vt").innerHTML=`<span>Indicadores:</span><button class="btn sm" data-v="sonda" aria-pressed="${vista==="sonda"}">Sonda seleccionada${ms?": "+esc(ms.n):""}</button><button class="btn sm" data-v="general" aria-pressed="${vista==="general"}">Vista general (todas las sondas)</button>`;
 $("kpis").innerHTML=`<div class="kpi"><div class="num">${kp.length}</div><span>Piezas en seguimiento</span></div>`+
  ["Compras","Maestranza","Soldadura","Pintura","Servicio externo"].map(e=>`<button class="kpi" data-e="${e}" aria-pressed="${fe===e}" style="border-left-color:var(--c${idx(e)})"><div class="num">${kp.filter(p=>p.e===e).length}</div><span>En ${e.toLowerCase()}</span></button>`).join("")+
  `<button class="kpi ${kp.some(late)?"bad":""}" data-e="${LATE}" aria-pressed="${fe===LATE}"><div class="num">${kp.filter(late).length}</div><span>Piezas atrasadas</span></button>`+
  `<div class="kpi" style="border-left-color:var(--c7)"><div class="num">${prog(kp)}%</div><span>${vista==="general"?"Avance de la flota":"Avance de la sonda"}</span></div>`;
 $("ms").innerHTML=D.m.length?D.m.map(m=>{const ps=all.filter(p=>p.s===m.id),l=ps.filter(late).length;
  return `<button class="mc" data-m="${m.id}" aria-pressed="${sel===m.id}"><div class="top"><b>${esc(m.n)}</b><span class="num">${prog(ps)}%</span></div>${ps.length?seg(ps):""}<small>${ps.filter(p=>p.e==="Listo").length}/${ps.length} piezas listas · ${days(m.ing,today)} d en taller</small><br><small class="${m.com<today?"late":""}">Programada ${fmt(m.com)}${l?` · <span class="late">${l} atrasada${l>1?"s":""}</span>`:""}</small></button>`}).join(""):`<div class="empty">Aún no hay sondas. Crea una con “Nueva sonda”.</div>`;
 const m=D.m.find(x=>x.id===sel);
 if(!m){$("det").innerHTML=`<div class="empty">Selecciona una sonda para ver sus componentes y piezas.</div>`;return}
 const ps=all.filter(p=>p.s===m.id),shown=ps.filter(p=>fm(p));
 const U=p=>p.u||"Sin unidad";
 const units=[...new Set(ps.map(U))].filter(u=>shown.some(p=>U(p)===u));
 $("det").innerHTML=`<div class="tools" style="justify-content:space-between"><div><h2 style="margin:0">${esc(m.n)}</h2><span class="sub">Ingreso ${fmt(m.ing)} · programada ${fmt(m.com)}</span></div><div><span class="num" style="font-size:40px;font-weight:700">${prog(ps)}%</span> <button class="btn sm" id="em">Editar sonda</button></div></div>
 ${ps.length?seg(ps):""}
 <div class="legend">${ST.map((e,i)=>`<span><b style="background:var(--c${i})"></b>${e} ${ps.filter(p=>p.e===e).length}</span>`).join("")} <button class="btn sm" id="ca">Contraer todo</button> <button class="btn sm" id="xa">Expandir todo</button>${fe?` <button class="btn sm" id="cf">Quitar filtro: ${fl()}</button>`:""}</div>`+
 (units.length?units.map(u=>{const raw=u==="Sin unidad"?"":u,col=D.uc[ukey(m.id,raw)]||"var(--accent)",up=ps.filter(p=>U(p)===u),ks=[...new Set(up.map(p=>p.c))].filter(c=>shown.some(p=>U(p)===u&&p.c===c));const uk=ukey(m.id,raw),cu=COL.has(uk);return `<div class="unit" style="border-left-color:${col}"><div class="hd"><h2><button class="tg" data-tu="${esc(uk)}" aria-expanded="${!cu}">${esc(u)}</button></h2><span class="r"><span class="sub">${up.filter(p=>p.e==="Listo").length}/${up.length} listas</span><span class="pct u${prog(up)>=100?" full":""}">${prog(up)}%</span><button class="btn sm" data-eu="${esc(raw)}">Editar unidad</button></span></div>${seg(up)}`+(cu?[]:ks).map(c=>{const kk=uk+"|"+c,ck=COL.has(kk),cp=up.filter(p=>p.c===c);return `<div class="comp"><div class="hd"><h3><button class="tg" data-tk="${esc(kk)}" aria-expanded="${!ck}">${esc(c)}</button></h3><span class="r"><span class="sub">${cp.filter(p=>p.e==="Listo").length}/${cp.length} listas</span><span class="pct k${prog(cp)>=100?" full":""}">${prog(cp)}%</span></span></div>${seg(cp)}`+(ck?"":`<div class="scroll"><table><colgroup><col style="width:22%"><col style="width:13%"><col style="width:9%"><col style="width:18%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:8%"></colgroup><thead><tr><th>Pieza</th><th>Código</th><th>Cantidad</th><th>Etapa</th><th>RQ</th><th>SMM3</th><th>Prometida</th><th></th></tr></thead><tbody>`+
 cp.filter(p=>fm(p)).map(p=>`<tr><td>${esc(p.p)}</td><td>${esc(p.cod||"—")}</td><td>${p.cant||1}</td><td><select data-pe="${p.id}" style="border-left-color:var(--c${idx(p.e)})" aria-label="Etapa de ${esc(p.p)}">${ST.map(e=>`<option${e===p.e?" selected":""}>${e}</option>`).join("")}</select></td><td>${esc(p.oc||"—")}</td><td>${esc(p.smm||"—")}</td><td class="${late(p)?"late":""}">${fmt(p.f)}${late(p)?" (atrasada)":""}</td><td><button class="btn sm" data-ep="${p.id}">Editar</button></td></tr>`).join("")+`</tbody></table></div>`)+`</div>`}).join("")+`</div>`}).join(""):
 `<div class="empty">${ps.length?(fe===LATE?"Ninguna pieza atrasada.":"Ninguna pieza está en esta etapa."):"Esta sonda aún no tiene piezas. Agrega la primera con “Nueva pieza”."}</div>`);
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.v){vista=t.dataset.v;try{localStorage.setItem("sondas-vista",vista)}catch(e){}render()}
 else if(t.dataset.tu||t.dataset.tk){const k=t.dataset.tu||t.dataset.tk;COL.has(k)?COL.delete(k):COL.add(k);saveCol();render()}
 else if(t.id==="ca"){D.p.filter(p=>p.s===sel).forEach(p=>{const uk=ukey(sel,p.u||"");COL.add(uk);COL.add(uk+"|"+p.c)});saveCol();render()}
 else if(t.id==="xa"){[...COL].forEach(k=>{if(k.startsWith(sel+"|"))COL.delete(k)});saveCol();render()}
 else if(t.dataset.m){sel=t.dataset.m;render()}
 else if(t.dataset.e){fe=fe===t.dataset.e?"":t.dataset.e;render()}
 else if(t.id==="cf"){fe="";render()}
 else if(t.dataset.ep)openP(D.p.find(p=>p.id===t.dataset.ep));
 else if(t.dataset.eu!==undefined)openU(sel,t.dataset.eu);
 else if(t.id==="em")openM(D.m.find(m=>m.id===sel));
});
document.addEventListener("change",e=>{const id=e.target.dataset.pe;if(id){D.p.find(p=>p.id===id).e=e.target.value;save();render()}});
function fillUnits(sv,selU){
 const f=$("fp").elements,us=[...new Set(D.p.filter(p=>p.s===sv).map(p=>p.u||""))];
 f.unidad.innerHTML=us.map(u=>`<option value="${esc(tok(u))}">${esc(u||"Sin unidad")}</option>`).join("")+`<option value="${NEW}">＋ Nueva unidad…</option>`;
 f.unidad.value=selU!==undefined&&us.includes(selU)?tok(selU):(us.length?tok(us[0]):NEW);
 syncU();
}
function syncU(){
 const f=$("fp").elements,isNew=f.unidad.value===NEW;
 f.unidadN.hidden=!isNew;f.unidadN.required=isNew;
 fillKits();
}
function fillKits(selK){
 const f=$("fp").elements,uv=f.unidad.value;
 const ks=uv===NEW?[]:[...new Set(D.p.filter(p=>p.s===f.sonda.value&&(p.u||"")===untok(uv)).map(p=>p.c))];
 f.comp.innerHTML=ks.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join("")+`<option value="${NEW}">＋ Nuevo kit / componente…</option>`;
 f.comp.value=selK!==undefined&&ks.includes(selK)?selK:(ks.length?ks[0]:NEW);
 syncK();
}
function syncK(){const f=$("fp").elements,isNew=f.comp.value===NEW;f.compN.hidden=!isNew;f.compN.required=isNew}
{const f=$("fp").elements;f.sonda.onchange=()=>fillUnits(f.sonda.value);f.unidad.onchange=syncU;f.comp.onchange=syncK}
function openP(p){
 if(!D.m.length){alert("Primero crea una sonda.");return}
 editP=p?p.id:null;$("fp").reset();const f=$("fp").elements;
 f.sonda.innerHTML=D.m.map(m=>`<option value="${m.id}">${esc(m.n)}</option>`).join("");
 const v=p||{s:sel||D.m[0].id,c:"",p:"",cant:1,e:"Pendiente",prov:"",oc:"",f:""};
 f.sonda.value=v.s;fillUnits(v.s,p?(v.u||""):undefined);fillKits(p?v.c:undefined);f.pieza.value=v.p;f.cod.value=v.cod||"";f.cant.value=v.cant;f.etapa.value=v.e;f.oc.value=v.oc;f.smm.value=v.smm||"";f.fecha.value=v.f;
 $("dd").style.visibility=p?"visible":"hidden";$("dp").showModal();
}
$("np").onclick=()=>openP();$("cp").onclick=()=>$("dp").close();
$("fp").onsubmit=e=>{const f=e.target.elements;
 const uv=f.unidad.value;let u=uv===NEW?f.unidadN.value.trim():untok(uv);if(u.toLowerCase()==="sin unidad")u="";
 const c=f.comp.value===NEW?f.compN.value.trim():f.comp.value;
 const o={id:editP||"p"+Date.now(),s:f.sonda.value,c:c,p:f.pieza.value.trim(),cod:f.cod.value.trim(),cant:+f.cant.value||1,e:f.etapa.value,prov:(D.p.find(p=>p.id===editP)||{}).prov||"",oc:f.oc.value.trim(),smm:f.smm.value.trim(),u:u,f:f.fecha.value};
 const i=D.p.findIndex(p=>p.id===editP);if(i>=0)D.p[i]=o;else D.p.push(o);sel=o.s;save();render()};
$("dd").onclick=()=>{if(confirm("¿Eliminar esta pieza?")){D.p=D.p.filter(p=>p.id!==editP);save();render();$("dp").close()}};
let editU=null,uReset=true;const UDEF="#e8a200";
function openU(sid,u){editU={s:sid,u};const f=$("fu").elements,c=D.uc[ukey(sid,u)];f.n.value=u===""?"Sin unidad":u;f.c.value=c||UDEF;uReset=!c;$("du").showModal()}
$("cu").onclick=()=>$("du").close();
$("uc0").onclick=()=>{$("fu").elements.c.value=UDEF;uReset=true};
$("fu").elements.c.oninput=()=>{uReset=false};
$("fu").onsubmit=e=>{const f=e.target.elements,{s:sid,u}=editU;let n=f.n.value.trim();if(n.toLowerCase()==="sin unidad")n="";
 const col=uReset?null:f.c.value;
 D.p.forEach(p=>{if(p.s===sid&&(p.u||"")===u)p.u=n});
 delete D.uc[ukey(sid,u)];if(col)D.uc[ukey(sid,n)]=col;
 save();render()};
function openM(m){editM=m?m.id:null;$("fm").reset();const f=$("fm").elements;f.n.value=m?m.n:"";f.ing.value=m?m.ing:today;f.com.value=m?m.com:iso(14);$("dmx").style.visibility=m?"visible":"hidden";$("dm").showModal()}
$("ns").onclick=()=>openM();$("cm").onclick=()=>$("dm").close();
$("fm").onsubmit=e=>{const f=e.target.elements,o={id:editM||"m"+Date.now(),n:f.n.value.trim(),ing:f.ing.value,com:f.com.value};
 const i=D.m.findIndex(m=>m.id===editM);if(i>=0)D.m[i]=o;else D.m.push(o);sel=o.id;save();render()};
$("dmx").onclick=()=>{if(confirm("¿Eliminar la sonda y todas sus piezas?")){D.m=D.m.filter(m=>m.id!==editM);D.p=D.p.filter(p=>p.s!==editM);sel=D.m[0]?.id;save();render();$("dm").close()}};

/* ===== SINCRONIZACIÓN COMPARTIDA (Firebase Realtime Database) ===== */
const FIREBASE_CONFIG={
 databaseURL:"https://avance-e0cc4-default-rtdb.firebaseio.com"   // ej: https://mi-proyecto-default-rtdb.firebaseio.com
};
let ref=null,lastJSON=null;
function setStatus(t,c){const s=$("sync");if(s){s.textContent=t;s.style.color=c}}
function push(){
 if(!ref)return;
 const j=JSON.stringify(D);lastJSON=j;
 ref.set(j).then(()=>setStatus("● Sincronizado","#2e9d57")).catch(()=>setStatus("● Error al guardar","#d33"));
}
function initSync(){
 if(!window.firebase||FIREBASE_CONFIG.databaseURL.startsWith("PEGA")){setStatus("● Solo local (sin Firebase)","#999");return}
 try{
  firebase.initializeApp(FIREBASE_CONFIG);
  ref=firebase.database().ref("sondas");
  setStatus("● Conectando…","#e8a200");
  ref.on("value",snap=>{
   const v=snap.val();
   if(v==null){push();return}            // primera vez: sube los datos actuales
   if(v===lastJSON){setStatus("● Sincronizado","#2e9d57");return}   // eco de mi propio cambio
   try{
    const nd=JSON.parse(v);
    if(nd&&nd.m&&nd.p){D=nd;D.uc=D.uc||{};lastJSON=v;
     try{localStorage.setItem(KEY,v)}catch(e){}
     if(!D.m.some(m=>m.id===sel))sel=D.m[0]?.id;
     render();
    }
   }catch(e){}
   setStatus("● Sincronizado","#2e9d57");
  },()=>setStatus("● Sin acceso a la base","#d33"));
 }catch(e){setStatus("● Error de configuración","#d33")}
}
initSync();
render();
</script>
